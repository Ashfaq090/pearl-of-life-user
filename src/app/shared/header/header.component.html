<div class="header p-4">
    <div class="d-grid gap-2 d-md-flex justify-content-between pb-3 border-bottom">
        <div class="d-flex align-items-end">
            <h5>{{activeItem || 'Header'}}</h5>
        </div>
        <div class="d-flex">
            <div class="p-2">
                <form class="d-flex" role="search">
                    <input class="form-control-sm me-2" type="search" placeholder="Search" aria-label="Search">
                    <img src="assets/icons/header/search.svg" alt="">
                </form>
            </div>
            <div class="p-2">
                <img src="assets/icons/header/settings.svg" alt="">
            </div>
            <div class="p-2">
                <img src="assets/icons/header/notification-plus.svg" alt="">
            </div>
            <div class="nav-item dropdown px-2">
                <!-- <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Dropdown link
                </a> -->
                <div class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="assets/images/user-default-image.svg" height="46" width="46">
                </div>
                <ul class="dropdown-menu">
                  <li><span class="dropdown-item" (click)="logout()">Logout</span></li>
                </ul>
            <div>
        </div>
    </div>
</div>
