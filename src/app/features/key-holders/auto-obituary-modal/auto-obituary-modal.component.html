<div class="modal-header d-flex align-items-center justify-content-between">
  <h4 class="modal-title mb-0">Auto Obituary</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="dismiss()"
  ></button>
</div>
<div class="modal-body">
  <p class="mb-3">Now let's start you Auto-Obituary</p>
  <div class="mb-3">
    <video
      #bgVideo
      autoplay
      playsinline
      preload="auto"
      class="legacy-video-bg w-100 rounded"
    >
      <source src="/assets/auto-obituary-video.mp4" type="video/mp4" />
    </video>
  </div>
  <button type="button" class="btn submit-button" (click)="goToObituaryInfo()">
    Auto-Obituary
  </button>
</div>
